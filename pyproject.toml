[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hiwaga-mcp"
version = "0.1.0"
description = "HIWAGA Development & Evidence Control Plane (local-first MCP server)"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]==2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
hiwaga-mcp = "hiwaga_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
